<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personagem - Vida Secreta do Computador</title>


    <!-- Fonte Poppins -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- CSS -->

    <link rel="stylesheet" href="../css/style.css">


</head>


<body class="pagina-personagem">


    <!-- Fundo -->

    <div class="fundo-gradiente"></div>



    <!-- ===========================
         ÁREA PRINCIPAL
    ============================ -->


    <main class="container-personagem">



        <section class="card-personagem-jogo">



            <!-- Imagem -->

            <img
                id="imagemPersonagem"
                class="imagem-personagem"
                src=""
                alt="Personagem">





            <!-- Nome -->

            <h1 id="nomePersonagem">

            </h1>





            <!-- Caixa de diálogo -->

            <div class="caixa-dialogo">


                <div class="icone-dialogo">

                    💬

                </div>



                <p id="textoDialogo">

                </p>

                <div class="progresso-dialogo" aria-label="Progresso da explicação">
                    <div id="barraDialogo"></div>
                </div>
                <small id="objetivoDialogo" class="objetivo-dialogo"></small>




                <button
                    id="btnContinuarDialogo"
                    class="botao-principal">

                    Continuar

                </button>

                <button
                    id="btnCuriosidade"
                    class="escondido">
                    Curiosidade
                </button>



            </div>








            <!-- Curiosidade -->

            <div
                id="areaCuriosidade"
                class="area-info escondido">


                <h2>

                    💡 Curiosidade

                </h2>


                <p id="textoCuriosidade">

                </p>

                <div id="areaAula" class="aula-personagem">
                    <h3>📚 O que você precisa saber</h3>
                    <div class="blocos-aula">
                        <div><strong>O que sou</strong><p id="conceitoPersonagem"></p></div>
                        <div><strong>Como trabalho</strong><p id="funcionamentoPersonagem"></p></div>
                        <div><strong>Exemplo no cotidiano</strong><p id="exemploPersonagem"></p></div>
                        <div><strong>Não confunda</strong><p id="naoConfundaPersonagem"></p></div>
                    </div>
                </div>


                <button
                    id="btnIniciarQuiz"
                    class="botao-principal">


                    Fazer Missão


                </button>


            </div>









            <!-- QUIZ -->

            <div
                id="areaQuiz"
                class="area-quiz escondido">



                <h2>

                    🎯 Missão

                </h2>

                <div class="quiz-cabecalho">
                    <span id="nivelBloom" class="badge-bloom">Compreender</span>
                    <span id="cronometroQuiz" class="cronometro">⏱️ 30s</span>
                    <button id="btnDica" class="botao-dica" type="button">💡 Dica</button>
                </div>

                <div class="progresso-pergunta" aria-label="Progresso do desafio">
                    <div id="barraPergunta"></div>
                </div>



                <p id="perguntaQuiz">

                </p>

                <p id="dicaQuiz" class="dica-quiz escondido"></p>
                <p id="feedbackQuiz" class="feedback-quiz" role="status"></p>





                <div
                    id="alternativasQuiz"
                    class="alternativas">


                </div>

                <button
                    id="btnProximaPergunta"
                    class="botao-principal escondido"
                    type="button">
                    Próxima pergunta
                </button>




            </div>









            <!-- Resultado -->

            <div
                id="areaResultado"
                class="area-info escondido">


                <h2 id="tituloResultado">

                </h2>


                <p id="textoResultado">

                </p>

                <div id="resumoAprendizagem" class="resumo-aprendizagem"></div>



                <button
                    id="btnVoltarMapa"
                    class="botao-secundario">


                    🗺️ Voltar ao Mapa


                </button>

                <button id="btnTentarNovamente" class="botao-principal escondido">🔁 Tentar novamente</button>


            </div>




        </section>




    </main>








    <!-- Botão voltar caso queira sair -->

    <button
        onclick="voltarMapa()"
        class="botao-flutuante">


        ← Mapa


    </button>







    <!-- JavaScript -->
    <script src="../js/tema.js"></script>
    <script src="../js/som.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/progresso.js"></script>
    <script src="../js/personagens.js"></script>
    <script src="../js/dialogos.js"></script>
    <script src="../js/quiz.js"></script>
    <script src="../js/virus.js"></script>


</body>


</html>
