<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificado - Vida Secreta do Computador</title>


    <!-- Fonte Poppins -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">



    <!-- CSS -->

    <link rel="stylesheet" href="../css/style.css">


</head>


<body class="pagina-certificado">



    <!-- Fundo -->

    <div class="fundo-gradiente"></div>





    <!-- ===============================
         CERTIFICADO FINAL
    ================================ -->



    <main class="container-certificado">



        <section class="certificado">





            <div class="trofeu">

                🏆

            </div>





            <h1>

                Parabéns!

            </h1>




            <h2>

                Você salvou o computador!

            </h2>






            <p class="mensagem-certificado">


                Você conseguiu aprender sobre todos
                os habitantes do sistema e derrotou
                o Vírus Misterioso.


                <br><br>


                Agora você conhece os segredos
                que existem dentro de um computador.


            </p>








            <!-- XP FINAL -->

            <div class="xp-final">


                <span>

                    ⭐ XP Total:

                </span>



                <strong id="xpFinal">

                    0

                </strong>



            </div>









            <div class="selo">

                💻
                <br>

                Guardião do Computador

            </div>









            <button
                id="btnJogarNovamente"
                class="botao-principal">


                🔄 Jogar Novamente


            </button>





        </section>




    </main>









    <!-- JavaScript -->

    <script src="../js/som.js"></script>
    <script src="../js/util.js"></script>
    <script src="../js/progresso.js"></script>
    <script src="../js/certificado.js"></script>



</body>


</html>
